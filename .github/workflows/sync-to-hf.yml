# Pushes the repository to a Hugging Face Space on every push to main, so the public server
# rebuilds itself from the code in GitHub. See docs/HOSTING.md for the one-time setup:
#
#   1. Create a Docker Space on huggingface.co (e.g. sd89/barberstrike).
#   2. Add a repository secret HF_TOKEN (a Hugging Face token with "write" access).
#   3. Add a repository variable HF_SPACE with the Space id, e.g. sd89/barberstrike.
#
# The Space's own README front matter (sdk: docker, app_port: 7860) lives in this repo's README.md.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
