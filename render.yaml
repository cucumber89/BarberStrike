# Render blueprint: New → Blueprint → this repository. See docs/HOSTING.md.
services:
  - type: web
    name: barberstrike
    runtime: docker
    plan: free
    # Frankfurt: ~30 ms from Poland. The default (Oregon) measured ~200 ms on the first deploy.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
